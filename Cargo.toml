[package]
name = "memz"
version = "1.0.0"
edition = "2024"
authors = ["Nima Naseri nerdnull@proton.me"]
description = "Memory analyzer with PSS tracking"
repository = "https://github.com/naseridev/memz"
keywords = ["memory", "monitoring", "system", "cross-platform"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
anyhow = "1.0"
sysinfo = "0.33"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true