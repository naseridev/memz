name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            install_musl: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (for ARM cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git --rev 1b312cf

      - name: Build binary (native)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Prepare package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="memz-${VERSION}-${{ matrix.target }}"
          DIST_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${DIST_DIR}"

          BIN_NAME="memz"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="memz.exe"
          fi

          BIN_PATH="target/${{ matrix.target }}/release/${BIN_NAME}"
          cp "${BIN_PATH}" "${DIST_DIR}/"

          [ -f "README.md" ] && cp "README.md" "${DIST_DIR}/"
          [ -f "LICENSE" ] && cp "LICENSE" "${DIST_DIR}/"

          mkdir -p artifacts
          cd dist

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../artifacts/${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            cd ../artifacts
            certutil -hashfile "${ARCHIVE_NAME}.zip" SHA256 | findstr -v ":" | tr -d " \r\n" > "${ARCHIVE_NAME}.zip.sha256"
          else
            tar -czf "../artifacts/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            cd ../artifacts
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" | cut -d ' ' -f 1 > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified checksum manifest
        run: |
          cd release-assets
          sha256sum memz-*.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false