name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/memz"
          PKG_NAME="memz-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "$BIN_PATH" "$PKG_NAME/"
          [ -f README.md ] && cp README.md "$PKG_NAME/"
          [ -f LICENSE ] && cp LICENSE "$PKG_NAME/"
          tar -czvf "${PKG_NAME}.tar.gz" "$PKG_NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/memz.exe"
          PKG_NAME="memz-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "$BIN_PATH" "$PKG_NAME/"
          [ -f README.md ] && cp README.md "$PKG_NAME/"
          [ -f LICENSE ] && cp LICENSE "$PKG_NAME/"
          7z a "${PKG_NAME}.zip" "$PKG_NAME"
          certutil -hashfile "${PKG_NAME}.zip" SHA256 | grep -E '^[0-9a-fA-F]{64}$' > "${PKG_NAME}.zip.sha256"

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memz-*${{ matrix.target }}.tar.gz
            memz-*${{ matrix.target }}.tar.gz.sha256
            memz-*${{ matrix.target }}.zip
            memz-*${{ matrix.target }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
